<!doctype html><html><head><meta charset="UTF-8"><title>Luxar · responsive audit</title><style>body{font:14px system-ui;background:#eee9e0;color:#24211e;margin:24px}button,select,a{padding:12px;margin:4px}iframe{background:#f8f6f1;border:1px solid #bbb;transform-origin:top left}pre{white-space:pre-wrap}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:8px;border:1px solid #bbb;text-align:left}.bad{color:#a02727}.ok{color:#23663f}#stage{overflow:auto;max-height:760px}label{margin:0 10px}</style></head><body><h1>Luxar storefront review</h1><p>Isolated local fixtures. No API writes leave this page. Catalog images are the real public product photos. Authentication, addresses, cart, orders and payment responses are simulated.</p><label>Page <select id="scene"></select></label><label>Width <select id="width"><option>390</option><option>768</option><option selected>1440</option></select></label><button id="preview">Preview page</button><button id="audit">Run every page at all widths</button><button id="download">Save results</button><p id="status" role="status">Choose a page to inspect.</p><div id="stage"></div><table><thead><tr><th>Page</th><th>Width</th><th>Overflow</th><th>Unnamed controls</th><th>Errors</th><th>CLS</th></tr></thead><tbody id="results"></tbody></table><pre id="detail"></pre><script type="module">
const scenes=['home','collection','empty','search','searchEmpty','product','cart','emptycart','account','accountempty','order','checkout','emptycheckout','login','register','tryon','pro','paymentpending','paymentfailed','success','notfound','unauth'];
const sel=document.querySelector('#scene');for(const scene of scenes)sel.add(new Option(scene,scene));
let reports=[],queue=[],active=null;
const show=(scene,width)=>{active={scene,width};document.querySelector('#status').textContent=`Reviewing ${scene} at ${width}px`;const frame=document.createElement('iframe');frame.width=width;frame.height=900;frame.title=`${scene} at ${width}px`;frame.src=`/qa/frame.html?scene=${scene}`;const scale=Math.min(1,(innerWidth-64)/width);frame.style.transform=`scale(${scale})`;document.querySelector('#stage').style.height=`${900*scale}px`;document.querySelector('#stage').style.maxHeight='none';document.querySelector('#stage').replaceChildren(frame);};
document.querySelector('#preview').onclick=()=>{queue=[];show(sel.value,Number(document.querySelector('#width').value));};
document.querySelector('#audit').onclick=()=>{reports=[];document.querySelector('#results').replaceChildren();queue=scenes.flatMap(scene=>[390,768,1440].map(width=>({scene,width})));const next=queue.shift();show(next.scene,next.width);};
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='luxar-qa'||event.source!==document.querySelector('iframe')?.contentWindow)return;const r=event.data.report;reports.push(r);const row=document.createElement('tr');row.className=r.documentOverflow||r.errors.length||r.unnamed.length?'bad':'ok';row.innerHTML=`<td>${r.scene}</td><td>${r.width}</td><td>${r.documentOverflow?'FAIL':'Pass'}</td><td>${r.unnamed.length}</td><td>${r.errors.length}</td><td>${r.cls}</td>`;document.querySelector('#results').append(row);document.querySelector('#detail').textContent=JSON.stringify(r,null,2);if(queue.length){const next=queue.shift();show(next.scene,next.width);}else{document.querySelector('#status').textContent=`Finished: ${reports.length} checks. ${reports.filter(r=>r.documentOverflow||r.errors.length||r.unnamed.length).length} need review.`;}});
document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(reports,null,2)],{type:'application/json'}));a.download='luxar-responsive-results.json';a.click();};
show('home',1440);
</script></body></html>
