<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Luxar | Wear the moment.</title>
    <meta name="title" content="Luxar | Wear the moment." />
    <meta
      name="description"
      content="Distinctive silhouettes. Unmistakably you. Explore the Luxar collection and picture your next look in our virtual fitting room."
    />
    <meta
      name="keywords"
      content="virtual try-on, AI fashion, online shopping, e-commerce, clothing store, fashion shopping, try before you buy, virtual fitting room, online boutique, fashion technology"
    />
    <meta name="author" content="Luxar" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://luxar-vtryon.vercel.app/" />
    <meta property="og:title" content="Luxar | Wear the moment." />
    <meta
      property="og:description"
      content="For the moments you make. Discover distinctive occasionwear and a personal way to try it on."
    />
    <meta
      property="og:image"
      content="https://luxar-vtryon.vercel.app/og-image.jpg"
    />
    <meta property="og:site_name" content="Luxar" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://luxar-vtryon.vercel.app/" />
    <meta property="twitter:title" content="Luxar | The occasion edit" />
    <meta
      property="twitter:description"
      content="Distinctive pieces. A personal point of view. Explore the Luxar collection."
    />
    <meta
      property="twitter:image"
      content="https://luxar-vtryon.vercel.app/og-image.jpg"
    />

    <!-- Additional SEO -->
    <link rel="canonical" href="https://luxar-vtryon.vercel.app/" />
    <meta name="theme-color" content="#801831" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Luxar",
        "url": "https://luxar-vtryon.vercel.app",
        "description": "Distinctive occasionwear and a virtual fitting room, by Luxar",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://luxar-vtryon.vercel.app/shop/search?keyword={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Luxar",
        "url": "https://luxar-vtryon.vercel.app",
        "logo": "https://luxar-vtryon.vercel.app/logo.png",
        "description": "Considered silhouettes, expressive colour and intricate details"
      }
    </script>

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
